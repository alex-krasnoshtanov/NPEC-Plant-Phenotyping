[project]
name = "npec-plant-phenotyping"
version = "0.1.0"
description = "Autonomous root-tip inoculation: U-Net root segmentation + OT-2 pipette control (PID and RL) in a PyBullet simulation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "segmentation-models-pytorch>=0.3.3",
    "opencv-python>=4.8.0",
    "albumentations>=1.3.1",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pillow>=10.0.0",
    "patchify==0.2.3",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "pybullet>=3.2.5",
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.0.0",
    "imageio>=2.31.0",
    "ipykernel>=6.25.0",
]
